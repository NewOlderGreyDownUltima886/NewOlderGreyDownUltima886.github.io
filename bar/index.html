<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f13">
    <title>ТТК Бармена</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icon-192.png">
</head>
<body>

    <main class="views-container">
    <!-- Экран 1: Главная -->
    <div id="view-home" class="view active">
        <header>
            <h1>Коктейли</h1>
            <p>ТТК • Рецепты • Генератор</p>
        </header>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Поиск по названию или ингредиенту..." oninput="app.handleSearch(this.value)" onkeydown="if(event.key === 'Enter') this.blur();" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="cocktail_search" enterkeyhint="search">
            <button type="button" class="search-clear" onclick="app.clearSearch()">×</button>
        </div>
        <div class="category-list" id="category-list"></div>
        <div class="drink-grid" id="search-results" style="display: none;"></div>
    </div>

    <!-- Экран 2: Список напитков в категории -->
    <div id="view-category" class="view">
        <header class="nav-header">
            <h2 id="category-title">Категория</h2>
        </header>
        <div class="drink-grid" id="drink-grid"></div>
    </div>

    <!-- Экран 3: Детали напитка -->
    <div id="view-detail" class="view">
        <div class="detail-hero">
            <div class="generator-preview" id="generator-preview"></div>
            <!-- <button class="back-btn floating" onclick="app.goBack()">←</button> -->
            <button class="edit-visual-btn" onclick="app.toggleVisualEditor()">🎨 Настроить</button>
        </div>
        
        <div class="detail-content">
            <div class="detail-header">
                <h2 id="detail-name">Название</h2>
            </div>
            <div class="tags">
                <span class="tag" id="detail-glass">Шот</span>
                <span class="tag" id="detail-method">Метод</span>
            </div>
            <h3>Состав</h3>
            <ul class="ingredients-list" id="ingredients-list"></ul>
            <button id="fav-btn" class="main-btn" onclick="app.toggleFavorite()">♡ Сохранить в избранное</button>
        </div>

        <!-- Выезжающая панель редактирования -->
        <div class="visual-editor-panel" id="visualEditorPanel">
            <div class="editor-header">
                <h3>Настройка вида</h3>
                <button class="close-editor" onclick="app.toggleVisualEditor()">✕</button>
            </div>
            <div class="editor-scroll">
                <div class="section-title">Посуда</div>
                <div class="v-grid" id="v-glassPicker"></div>
                
                <div class="section-title">Цвет жидкости</div>
                <div class="v-colors" id="v-colorPicker"></div>

                <div class="section-title">Гарнир</div>
                <div class="v-grid" id="v-garnishPicker"></div>

                <div class="section-title">Модификаторы</div>
                
                <div class="v-modifiers" style="flex-direction: column; gap: 10px;">
                    <label><input type="checkbox" id="v-iceToggle" onchange="app.updateVisual('ice', this.checked)"> Лёд</label>
                    <label><input type="checkbox" id="v-foamToggle" onchange="app.updateVisual('foam', this.checked)"> Пенка</label>
                    
                    <!-- Новый блок для слоев (виден только для шотов) -->
                    <div id="v-layersBox" style="border-top: 1px solid #444; padding-top: 10px; margin-top: 5px;">
                        <label style="margin-bottom: 10px; display: block;">
                            <input type="checkbox" id="v-layersToggle" onchange="app.toggleLayers(this.checked)"> Слои (для шотов)
                        </label>
                        <div id="v-layerSettings" style="display: none; gap: 10px; justify-content: space-between;">
                            <!-- Меняем value так, чтобы первый инпут был верхним слоем -->
                            <input type="color" id="v-layer3" onchange="app.updateLayerColor(2, this.value)" value="#54271c" style="width: 50px; height: 30px; border: none; border-radius: 4px; background: none; cursor: pointer;">
                            <input type="color" id="v-layer2" onchange="app.updateLayerColor(1, this.value)" value="#d9a04b" style="width: 50px; height: 30px; border: none; border-radius: 4px; background: none; cursor: pointer;">
                            <input type="color" id="v-layer1" onchange="app.updateLayerColor(0, this.value)" value="#f1dfb0" style="width: 50px; height: 30px; border: none; border-radius: 4px; background: none; cursor: pointer;">
                        </div>
                    </div>
                </div>
                
                <div class="section-title" style="margin-top: 15px;">Окантовка</div>
                <select id="v-rimSelect" class="v-select" onchange="app.updateVisual('rim', this.value)">
                    <option value="none">Без покрытия</option>
                    <option value="salt">Соль</option>
                    <option value="coconut">Кокосовая стружка</option>
                    <option value="chocolate">Шоколад</option>
                </select>

                <div class="section-title" style="margin-top: 15px;">Масштаб превью</div>
                <input type="range" id="v-zoomSlider" min="50" max="150" value="100" style="width: 100%; accent-color: var(--accent);" oninput="app.updateVisual('zoom', this.value)">
                
                <button class="save-visual-btn" onclick="app.saveVisualState()">💾 Сохранить для этого коктейля</button>
                
                <div class="data-actions">
                    <button class="export-btn" onclick="app.exportData()">📤 Экспорт</button>
                    <label class="import-btn">📥 Импорт<input type="file" accept=".json" onchange="app.importData(event)"></label>
                </div>
            </div>
        </div>
    </div>

    <!-- Экран 4: Избранное моё -->
    <div id="view-favorites" class="view">
        <header><h1>Избранное</h1></header>
        <div class="drink-grid" id="favorites-grid"></div>
    </div>
    </main>

    <nav class="bottom-nav">
        <button onclick="app.goHome()" class="nav-item active">🏠<br>Главная</button>
        <button onclick="app.showView('favorites')" class="nav-item">⭐<br>Избранное</button>
    </nav>

    <script src="data.js"></script>
    <script src="config.js"></script> 
    <script src="app.js"></script>
</body>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { scope: './' }));
    }
</script>
</html>
